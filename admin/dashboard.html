<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard — Saran Tours &amp; Travels</title>
  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/png" href="../images/favicon-192.png" />
  <link rel="apple-touch-icon" href="../images/saran-apple-touch.png" />
</head>

<body>
  <nav class="admin-nav">
    <div class="admin-nav-inner">
      <div class="admin-brand">
        <img src="../images/saran-logo.webp" alt="Saran Tours &amp; Travels logo">
        <span>Saran Tours Admin</span>
      </div>
      <div style="display:flex; align-items:center; gap:12px;">
        <span id="adminEmail" style="font-size:0.85rem; color:#888;"></span>
        <button id="logoutBtn" class="btn btn-sm btn-outline">Logout</button>
      </div>
    </div>
  </nav>

  <main class="admin-main">
    <div class="admin-container">
      <div class="admin-header">
        <h1>Cab Management</h1>
        <div style="display:flex; align-items:center; gap:12px;">
          <span id="realtimeStatus" style="font-size:0.8rem; color:#22c55e; display:none;">● Live</span>
          <button id="addCabBtn" class="btn btn-primary">+ Add New Cab</button>
        </div>
      </div>

      <div class="admin-card">
        <table class="admin-table">
          <thead>
            <tr>
              <th>Image</th>
              <th>Cab Name</th>
              <th>Type</th>
              <th>Price/km</th>
              <th>Availability</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="cabTableBody">
            <!-- Dynamic Data -->
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <!-- Add/Edit Modal -->
  <div id="cabModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="modalTitle">Add New Cab</h2>
        <span class="close">&times;</span>
      </div>
      <form id="cabForm">
        <input type="hidden" id="cabId">
        <div class="form-grid">
          <div class="form-field">
            <label>Cab Name</label>
            <input type="text" id="cabName" required>
          </div>
          <div class="form-field">
            <label>Cab Type</label>
            <select id="cabType" required>
              <option value="Hatchback">Hatchback</option>
              <option value="Sedan">Sedan</option>
              <option value="SUV">SUV</option>
              <option value="Tempo">Tempo Traveller</option>
              <option value="Luxury">Luxury</option>
            </select>
          </div>
          <div class="form-field">
            <label>Price per KM (₹)</label>
            <input type="number" id="cabPrice" required>
          </div>
          <div class="form-field">
            <label>Availability</label>
            <select id="cabAvailability">
              <option value="Available">Available</option>
              <option value="Booked">Booked</option>
              <option value="Maintenance">Maintenance</option>
            </select>
          </div>
          <div class="form-field form-full">
            <label>Image URL</label>
            <input type="text" id="cabImage" placeholder="e.g. images/sedan.png">
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline close-modal">Cancel</button>
          <button type="submit" class="btn btn-primary">Save Cab</button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/supabase.js"></script>
  <script src="/data-api.js"></script>
  <script src="/admin/script.js"></script>
  <script>
    // Auth guard — uses Supabase session, no localStorage
    document.addEventListener('DOMContentLoaded', async () => {
      await dataAPI.initPromise;
      const session = await dataAPI.getAdminSession();
      if (!session) {
        window.location.href = '/login';
        return;
      }

      // Show admin email
      const emailEl = document.getElementById('adminEmail');
      if (emailEl && session.user?.email) emailEl.textContent = session.user.email;

      // Logout via Supabase
      const logoutBtn = document.getElementById('logoutBtn');
      if (logoutBtn) {
        logoutBtn.addEventListener('click', async () => {
          await dataAPI.adminSignOut();
          window.location.href = '/login';
        });
      }
    });
  </script>
</body>

</html>
